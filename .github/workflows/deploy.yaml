name: Deploy to Render
run-name: Deploy ${{ github.event.release.tag_name || inputs.tag }} to Render

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual redeploy or legacy tag. Normally publish a GitHub Release with a tag selected from the list.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT_NAME" in
            release)
              tag="$RELEASE_TAG"
              if [[ "$WORKFLOW_REF" != "refs/tags/$tag" ]]; then
                echo 'The published release must match the triggering tag.' >&2
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
                echo 'Run manual redeploys from main and specify the tag.' >&2
                exit 1
              fi
              tag="$INPUT_TAG"
              ;;
            *)
              echo 'Deploy only a published release or an explicitly selected tag.' >&2
              exit 1
              ;;
          esac
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a release tag like v0.1.0.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout main and release tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh run list --workflow ci.yaml --branch main --event push \
            --commit "$DEPLOY_SHA" --status success --limit 100 --json conclusion \
            | jq --exit-status 'any(.[]; .conclusion == "success")'
      - name: Deploy to Render and wait for live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: python3 .github/scripts/deploy_render.py
