name: Deploy to Render
run-name: Deploy ${{ inputs.tag }} to Render

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require workflow from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main and specify the release tag in its input.' >&2
            exit 1
          fi
      - name: Checkout main and release tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a release tag like v0.1.0.' >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh run list --workflow ci.yaml --branch main --event push \
            --commit "$DEPLOY_SHA" --status success --limit 100 --json conclusion \
            | jq --exit-status 'any(.[]; .conclusion == "success")'
      - name: Deploy to Render and wait for live
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: python3 .github/scripts/deploy_render.py
