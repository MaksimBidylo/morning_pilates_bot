name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test tag and deploy scripts
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew clean build
      - name: Verify JaCoCo reports
        if: ${{ success() }}
        shell: bash
        run: |
          for report in \
            build/reports/jacoco/combined/coverage.xml \
            build/reports/jacoco/combined/html/index.html; do
            if [ ! -f "$report" ] || [ ! -s "$report" ]; then
              echo "::error file=$report::JaCoCo report is missing or empty: $report"
              exit 1
            fi
          done
      - name: Upload JaCoCo coverage
        if: ${{ always() && hashFiles('build/reports/jacoco/combined/**') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/combined/
          if-no-files-found: warn
