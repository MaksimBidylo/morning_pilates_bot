name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test tag and deploy scripts
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and test
        run: >-
          ./gradlew clean build
          -x ktlintKotlinScriptCheck
          -x ktlintMainSourceSetCheck
          -x ktlintTestSourceSetCheck
          -x detekt
      - name: Verify JaCoCo reports
        if: ${{ success() }}
        shell: bash
        run: |
          for report in \
            build/reports/jacoco/combined/coverage.xml \
            build/reports/jacoco/combined/html/index.html; do
            if [ ! -f "$report" ] || [ ! -s "$report" ]; then
              echo "::error file=$report::JaCoCo report is missing or empty: $report"
              exit 1
            fi
          done
      - name: Upload JaCoCo coverage
        if: ${{ always() && hashFiles('build/reports/jacoco/combined/**') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/combined/
          if-no-files-found: warn
      # Only the new Sonar handoff is non-blocking for CI and release tagging.
      - name: Prepare Sonar analysis inputs
        id: sonar-inputs
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          for source_set in ("main", "test"):
              classes = Path(f"build/classes/kotlin/{source_set}")
              if not any(path.is_file() and not path.is_symlink() and path.stat().st_size
                         for path in classes.rglob("*.class")):
                  raise SystemExit(f"Missing compiled Kotlin classes: {classes}")
          report = Path("build/reports/jacoco/combined/coverage.xml")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit(f"Missing or empty JaCoCo XML: {report}")
          metadata = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "checkout_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
          }
          Path("build/sonar-analysis.json").write_text(json.dumps(metadata))
          PYTHON
      - name: Upload Sonar analysis inputs
        if: ${{ success() && steps.sonar-inputs.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sonar-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/classes/
            build/reports/jacoco/combined/coverage.xml
            build/sonar-analysis.json
          if-no-files-found: error

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check Kotlin formatting
        run: ./gradlew ktlintCheck

  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Analyze Kotlin code
        run: ./gradlew detekt
