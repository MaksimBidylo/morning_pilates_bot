ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ morningpilates.ApplicationKt.module ]
    }
}

telegram {
    botToken = ${?TELEGRAM_BOT_TOKEN}
    trainingSearchDateCalendarEnabled = false
    trainingSearchDateCalendarEnabled = ${?TRAINING_SEARCH_DATE_CALENDAR_ENABLED}
    trainingDateCalendarEnabled = false
    trainingDateCalendarEnabled = ${?TRAINING_DATE_CALENDAR_ENABLED}
}

security.telegramId {
    encryptionKey = ${?TELEGRAM_ID_ENCRYPTION_KEY}
    lookupKey = ${?TELEGRAM_ID_LOOKUP_KEY}
}

db {
    host = "postgres"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "morning_pilates"
    database = ${?DB_DATABASE}
    user = "morning_pilates"
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    sslMode = "prefer"
    sslMode = ${?DB_SSL_MODE}
    maximumPoolSize = 5
    maximumPoolSize = ${?DB_POOL_SIZE}
}
