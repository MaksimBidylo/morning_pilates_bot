ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ morningpilates.ApplicationKt.module ]
    }
}

telegram {
    botToken = ${?TELEGRAM_BOT_TOKEN}
}

db {
    host = "postgres"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "morning_pilates"
    database = ${?DB_DATABASE}
    user = "morning_pilates"
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}
