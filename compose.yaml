services:
  app:
    build:
      context: .
    environment:
      PORT: "8080"
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/morning_pilates
      DB_USER: morning_pilates
      DB_PASSWORD: morning_pilates
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: morning_pilates
      POSTGRES_USER: morning_pilates
      POSTGRES_PASSWORD: morning_pilates
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
