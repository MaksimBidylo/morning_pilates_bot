services:
  app:
    build:
      context: .
    command:
      - -config=application.conf
      - -config=/app/application-local.conf
    volumes:
      - type: bind
        source: ./src/main/resources/application-local.conf
        target: /app/application-local.conf
        read_only: true
        bind:
          create_host_path: false
    environment:
      PORT: "8080"
      TRAINING_DATE_CALENDAR_ENABLED: "${TRAINING_DATE_CALENDAR_ENABLED:-false}"
      TELEGRAM_ID_ENCRYPTION_KEY: "${TELEGRAM_ID_ENCRYPTION_KEY:?Set TELEGRAM_ID_ENCRYPTION_KEY to a Base64-encoded 32-byte key}"
      TELEGRAM_ID_LOOKUP_KEY: "${TELEGRAM_ID_LOOKUP_KEY:?Set TELEGRAM_ID_LOOKUP_KEY to a Base64-encoded 32-byte key}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: morning_pilates
      DB_USER: morning_pilates
      DB_PASSWORD: morning_pilates
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: morning_pilates
      POSTGRES_USER: morning_pilates
      POSTGRES_PASSWORD: morning_pilates
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
